name = "kleihaus"
compatibility_date = "2025-01-01"
main = "src/worker.js"
workers_dev = true
routes = [
  { pattern = "www.kleihaus.com", zone_name = "kleihaus.com", custom_domain = true },
  { pattern = "kleihaus.com", zone_name = "kleihaus.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
SALES_EMAIL = "sales@kleihaus.com"
QUOTE_EMAIL_FROM = "Kleihaus Ceramics <sales@kleihaus.com>"
WHATSAPP_TO_NUMBER = "254748827166"

[[d1_databases]]
binding = "DB"
database_name = "kleihaus_quotes"
database_id = "895e6c3b-9f44-46fe-a96a-c45c3fe3278b"
