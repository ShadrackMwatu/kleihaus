name: SEO Pull Request Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/seo-pr-validation.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: seo-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout final PR head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, SEO tests and analytics mappings
        run: npm run ci:seo
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser SEO regression tests
        run: npm run seo:browser
